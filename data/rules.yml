version: "3.1"

rules:
  - rule: Tampilkan menu setelah salam
    steps:
      - intent: greet
      - action: utter_greet
      - action: utter_pilih_kategori

  - rule: Mulai kalkulator sesuai akun
    steps:
      - intent: hitung_emisi
      - action: action_start_account_calculation
  - rule: Mulai kalkulator dari permintaan listrik
    steps:
      - intent: hitung_emisi_listrik
      - action: action_start_account_calculation
  - rule: Mulai kalkulator dari permintaan transportasi
    steps:
      - intent: hitung_emisi_transportasi
      - action: action_start_account_calculation
  - rule: Mulai kalkulator dari permintaan rumah tangga
    steps:
      - intent: hitung_emisi_rumah_tangga
      - action: action_start_account_calculation

  - rule: Rekomendasikan proyek dari emisi tersimpan
    condition:
      - active_loop: null
    steps:
      - intent: ask_project_recommendation
      - action: action_recommend_projects

  - rule: Selesai kalkulator individu
    condition:
      - active_loop: personal_calculation_form
    steps:
      - action: personal_calculation_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_calculation
      - action: action_reset_calculation
      - action: utter_pilih_kategori
  - rule: Selesai kalkulator perusahaan
    condition:
      - active_loop: company_calculation_form
    steps:
      - action: company_calculation_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_calculation
      - action: action_reset_calculation
      - action: utter_pilih_kategori

  - rule: Batalkan kalkulator individu
    condition:
      - active_loop: personal_calculation_form
    steps:
      - intent: batal
      - action: action_deactivate_loop
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_reset_calculation
      - action: utter_batal
      - action: utter_pilih_kategori
  - rule: Batalkan kalkulator perusahaan
    condition:
      - active_loop: company_calculation_form
    steps:
      - intent: batal
      - action: action_deactivate_loop
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_reset_calculation
      - action: utter_batal
      - action: utter_pilih_kategori

  - rule: Proses nilai tidak dikenal dalam form individu
    condition:
      - active_loop: personal_calculation_form
    steps:
      - intent: nlu_fallback
      - action: personal_calculation_form
    wait_for_user_input: false
  - rule: Proses nilai tidak dikenal dalam form perusahaan
    condition:
      - active_loop: company_calculation_form
    steps:
      - intent: nlu_fallback
      - action: company_calculation_form
    wait_for_user_input: false

  - rule: Tanggapi pembatalan di luar form
    condition:
      - active_loop: null
    steps:
      - intent: batal
      - action: utter_batal
      - action: utter_pilih_kategori
  - rule: Ucapkan salam perpisahan
    steps:
      - intent: goodbye
      - action: utter_goodbye
  - rule: Jelaskan identitas Cami
    steps:
      - intent: bot_challenge
      - action: utter_iamabot
  - rule: Jelaskan carbon offset
    steps:
      - intent: ask_carbon_offset
      - action: utter_ask_carbon_offset
  - rule: Jelaskan emisi karbon
    steps:
      - intent: ask_carbon_emission
      - action: utter_ask_carbon_emission
  - rule: Jelaskan CO2e
    steps:
      - intent: ask_co2e
      - action: utter_ask_co2e
  - rule: Jelaskan sumber emisi
    steps:
      - intent: ask_emission_sources
      - action: utter_ask_emission_sources
  - rule: Jelaskan scope emisi
    steps:
      - intent: ask_emission_scopes
      - action: utter_ask_emission_scopes
  - rule: Beri panduan pengurangan emisi
    steps:
      - intent: ask_emission_reduction
      - action: utter_ask_emission_reduction
  - rule: Bedakan offset dan pengurangan
    steps:
      - intent: ask_offset_vs_reduction
      - action: utter_ask_offset_vs_reduction
  - rule: Jelaskan verifikasi proyek secara umum
    steps:
      - intent: ask_project_verification_general
      - action: utter_ask_project_verification_general

  - rule: Ambil informasi proyek dari CAMAR
    condition:
      - active_loop: null
    steps:
      - intent: ask_project_information
      - action: action_project_information
  - rule: Periksa status verifikasi proyek
    condition:
      - active_loop: null
    steps:
      - intent: ask_project_verification_status
      - action: action_project_verification
  - rule: Jelaskan alasan rekomendasi
    condition:
      - active_loop: null
    steps:
      - intent: ask_recommendation_reason
      - action: action_explain_recommendation
  - rule: Jelaskan hasil emisi terakhir
    condition:
      - active_loop: null
    steps:
      - intent: ask_result_explanation
      - action: action_explain_latest_emission

  - rule: Tampilkan saldo karbon akun
    condition:
      - active_loop: null
    steps:
      - intent: ask_carbon_balance
      - action: action_carbon_balance

  - rule: Simulasikan pembelian kredit karbon
    condition:
      - active_loop: null
    steps:
      - intent: simulate_offset_purchase
      - action: action_simulate_offset_purchase

  - rule: Bandingkan proyek karbon
    condition:
      - active_loop: null
    steps:
      - intent: compare_projects
      - action: action_compare_projects

  - rule: Jelaskan informasi sebelum membeli proyek
    condition:
      - active_loop: null
    steps:
      - intent: ask_purchase_disclosure
      - action: action_purchase_disclosure

  - rule: Susun rencana pengurangan personal
    condition:
      - active_loop: null
    steps:
      - intent: ask_personal_action_plan
      - action: action_personal_action_plan

  - rule: Tampilkan panduan CAMAR
    steps:
      - intent: guide_camar
      - action: utter_guide_camar
  - rule: Tampilkan panduan kalkulator
    steps:
      - intent: guide_calculator
      - action: utter_guide_calculator
  - rule: Tampilkan panduan hasil dan riwayat emisi
    steps:
      - intent: guide_emission_history
      - action: utter_guide_emission_history
  - rule: Tampilkan panduan memilih proyek
    steps:
      - intent: guide_project_selection
      - action: utter_guide_project_selection
  - rule: Tampilkan panduan sertifikat
    steps:
      - intent: guide_certificate
      - action: utter_guide_certificate
  - rule: Tangani pesan yang tidak dipahami
    steps:
      - intent: nlu_fallback
      - action: utter_please_rephrase
  - rule: Tangani pesan di luar topik
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope
